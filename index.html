            <div class="list-controls">
                <input type="text" id="song-search" placeholder="Search songs..." class="search-input">

            <div id="song-list-container" class="song-list">
                <!-- Song cards will be rendered here -->
            </div>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>No songs found.</p>
            </div>

        <!-- Song Detail View -->
        <section id="song-detail-view" class="view-section" style="display: none;">
            <div class="detail-header">
                <button id="back-btn" class="btn btn-icon" title="Back to List">⬅️ Back</button>
                <div class="song-info">
                    <h2 id="detail-title">Song Title</h2>
                    <span id="detail-key" class="badge">Key: C</span>
                </div>
                <div class="transpose-controls">
                    <button id="transpose-down" class="btn btn-icon" title="Transpose Down">-</button>
                    <span id="transpose-indicator">0</span>
                    <button id="transpose-up" class="btn btn-icon" title="Transpose Up">+</button>
                </div>
            </div>
            <div id="chord-chart" class="chord-chart-container">
                <!-- Chord chart will be rendered here -->
